<!-- ============================================================
     7. FORMULARIO CON BOTONES
     ============================================================ -->
<h2>Formulario con botones</h2>
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">
<br>
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<!-- <button>: boton mas flexible que <input>, porque puede contener texto, iconos o imagenes.
     type="submit": al presionarlo envia el formulario.
     <i class="fa-regular fa-paper-plane">: icono de Font Awesome (avion de papel).
       "fa-regular" indica el estilo del icono y "fa-paper-plane" cual icono es -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
<!-- type="reset": limpia el formulario.
     "fa fa-trash": icono de bote de basura de Font Awesome -->
</form>

<!-- ============================================================
     4. FORMULARIOS CON CHECKBOX
     ============================================================ -->
<h2>Formularios con checkbox</h2>
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">
<br>
Selecciona los lenguajes que conozcas:
<br>
<input type="checkbox" name="Java">Java <br>
<!-- type="checkbox": casilla de verificacion; permite marcar UNA O VARIAS opciones a la vez.
     name="Java": nombre de esa casilla; solo se envia si esta marcada.
     El texto "Java" que esta a su lado es la etiqueta que ve el usuario -->
<input type="checkbox" name="Python"> Python <br>
<!-- Segunda casilla, independiente de la primera -->
<input type="checkbox" name="C#">C# <br>
<!-- Tercera casilla -->
<input type="checkbox" name="Flutter"> Flutter <br>
<!-- Cuarta casilla. Cada una tiene su propio name, por eso se pueden marcar todas -->
</form>
<!-- Este formulario no lleva boton de envio, por eso solo se muestra como ejemplo visual -->

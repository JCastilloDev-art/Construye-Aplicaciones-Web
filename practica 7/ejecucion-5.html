<h2>Formularios con checkbox</h2>
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">
<br>
Selecciona los lenguajes que conozcas:
<br>
<input type="checkbox" name="Java">Java <br>
<!-- type="checkbox": casilla de verificacion; permite marcar UNA O VARIAS opciones a la vez.
     name="Java": nombre de esa casilla; solo se envia si esta marcada.
     El texto "Java" que esta a su lado es la etiqueta que ve el usuario -->

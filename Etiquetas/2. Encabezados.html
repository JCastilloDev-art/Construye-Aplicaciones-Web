<!--
=====================================================
  Archivo     : 2. Encabezados.html
  Tema        : Encabezados en HTML (h1 a h6)
  Descripcion : Muestra los 6 niveles de titulos que
                ofrece HTML, de mayor a menor tamaño.
=====================================================
-->
<!DOCTYPE html> <!-- Declara que el documento es HTML5 -->
<html lang="en"> <!-- Inicio del documento, idioma declarado: ingles -->

<!-- ================= CABECERA ================= -->
<head>
    <!-- Codificacion de caracteres -->
    <meta charset="UTF-8">
    <!-- Hace que la pagina se adapte al ancho de la pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titulo que aparece en la pestana del navegador -->
    <title>Encabezados HTML</title>
</head> <!-- fin del head -->

<!-- ================= CUERPO ================= -->
<body>

    <!-- Los encabezados van del h1 (mas grande) al h6 (mas pequeno) -->
    <h1>Titulo 1</h1> <!-- Nivel 1: el mas importante, se usa una vez por pagina -->
    <h2>Titulo 2</h2> <!-- Nivel 2 -->
    <h3>Titulo 3</h3> <!-- Nivel 3 -->
    <h4>Titulo 4</h4> <!-- Nivel 4 -->
    <h5>Titulo 5</h5> <!-- Nivel 5 -->
    <h6>Titulo 6</h6> <!-- Nivel 6: el de menor jerarquia -->
</body> <!-- fin del body -->

</html> <!-- fin del documento -->

<!--
=====================================================
  Archivo     : 4. Salto de linea.html
  Tema        : Salto de linea en HTML (etiqueta br)
  Descripcion : Lista lenguajes de programacion, uno
                por linea, dentro de un solo parrafo.
=====================================================
-->
<!DOCTYPE html> <!-- Documento HTML5 -->
<html lang="en"> <!-- Inicio del documento -->

<!-- ================= CABECERA ================= -->
<head>
    <meta charset="UTF-8"> <!-- Codificacion de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Diseño adaptable -->
    <title>Salto de linea en HTML</title> <!-- Texto de la pestana -->
</head> <!-- fin del head -->

<!-- ================= CUERPO ================= -->
<body>
    <h1>Lenguaje de programacion</h1> <!-- Titulo principal -->
    <p>En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entrenamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br>
        <!-- Nota: la etiqueta br inserta un salto de linea y no necesita cierre -->
        Dart<br> <!-- Lenguaje 1 -->
        Flutter<br> <!-- Lenguaje 2 (framework) -->
        Python<br> <!-- Lenguaje 3 -->
        Ruby<br> <!-- Lenguaje 4 -->
        Java<br> <!-- Lenguaje 5 -->
        TypeScript<br> <!-- Lenguaje 6 -->
        Entre otros. <!-- Ultima linea: sin br porque ya termina el parrafo -->
    </p> <!-- fin del parrafo -->
</body> <!-- fin del body -->

</html> <!-- fin del documento -->
